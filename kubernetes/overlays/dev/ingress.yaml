---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: api-v1
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: sweetrpg-initiative-strip-prefix-v1@kubernetescrd
    kubernetes.io/ingress.class: traefik

spec:
  ingressClassName: traefik
  rules:
    - host: dev.sweetrpg.com
      http:
        paths:
          # /0 always points at the latest version (currently v1); /1 is the pinned v1 route.
          # Callers use /0 unless they need a specific version. These paths and the
          # strip-prefix Middleware's prefixes must agree exactly (PADR-0015).
          - pathType: Prefix
            path: /api/0/initiative
            backend:
              service:
                name: api-v0
                port:
                  name: http
          - pathType: Prefix
            path: /api/1/initiative
            backend:
              service:
                name: api-v1
                port:
                  name: http
  tls:
    - hosts:
        - dev.sweetrpg.com
      # Shared secretName across every Ingress for this host; no ExternalDNS annotations here,
      # only main-web's Ingress carries them (docs/git-repos.md).
      secretName: sweetrpg-dev-tls
