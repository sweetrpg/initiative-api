---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: initiative-api-db

spec:
  refreshInterval: 1h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-db
    creationPolicy: Owner
  dataFrom:
    # The same Akeyless value atlas-db-user.yaml reads (as "password" there), so the app and the
    # Atlas-side user always agree, see atlas-db-user.yaml.
    - extract:
        key: /sweetrpg/initiative/api/db
      rewrite:
        - regexp:
            source: "DB_PASSWORD"
            target: DB_PW

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: initiative-api-cache

spec:
  refreshInterval: 1h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-cache
    creationPolicy: Owner
  dataFrom:
    # REDIS_PASS for the namespace cache. Must be the path the cache's ACL is built from
    # (infrastructure repo, initiative/cache overlays/dev/secrets.yaml).
    - extract:
        key: /sweetrpg/initiative/cache/auth
