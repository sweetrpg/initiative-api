# OpenFGA tuple reconciler (PADR-0035, PADR-0038, PADR-0040). Listed in kustomization.yaml and
# running (suspend: false). It needs:
#   1. User "initiative-reconciler" in users-api with only the openfga-writer role.
#   2. Akeyless item /sweetrpg/initiative/api/reconciler, whose "token" key holds an operator-minted
#      short-lived bearer for that user.
# The job exits non-zero (3) when auth-api rejects the token; mint a new one then (PADR-0038).
# reconciler-alert.yaml alerts when no run has succeeded in 15 minutes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: initiative-api-reconciler

spec:
  refreshInterval: 1m
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-reconciler
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /sweetrpg/initiative/api/reconciler
        property: token

---
apiVersion: batch/v1
kind: CronJob

metadata:
  name: reconciler

spec:
  schedule: "*/5 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 270
      template:
        spec:
          serviceAccountName: api
          enableServiceLinks: false
          restartPolicy: Never
          imagePullSecrets:
            - name: sweetrpg-registry
          containers:
            - name: reconciler
              image: initiative-api
              command: ["/app/bin/reconciler"]
              envFrom:
                - configMapRef:
                    name: api-common
                - configMapRef:
                    name: api-env
                - secretRef:
                    name: api-db
              env:
                - name: RECONCILER_TOKEN_FILE
                  value: /var/run/reconciler/token
              volumeMounts:
                - name: token
                  mountPath: /var/run/reconciler
                  readOnly: true
              resources:
                requests:
                  cpu: "20m"
                  memory: "55Mi"
                limits:
                  cpu: "250m"
                  memory: "128Mi"
          volumes:
            - name: token
              secret:
                secretName: api-reconciler
